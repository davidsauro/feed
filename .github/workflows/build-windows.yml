# Builds the desktop app for Windows.
#
# Not something that can be done from Linux. Tauri needs the target platform's
# webview and installer tooling, which on Windows means WebView2 and WiX or
# NSIS, so this runs on a Windows runner rather than cross compiling.
#
# Free to run. Actions has unlimited minutes on public repositories, Windows
# runners included. On a private repository the same build would spend minutes
# at twice the usual rate, which is worth knowing before this repository ever
# stops being public.

name: Build the Windows app

# Manual, and automatic for a version tag, matching the server image workflow. A
# desktop build takes long enough that running it on every push would be mostly
# waste while this is still being worked on.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build
    runs-on: windows-latest

    # Needed only by the last step, which attaches installers to a release.
    # Without it that upload fails on a repository whose default token is read
    # only, and it fails at the very end of a long build.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds here are long, and the OpenSSL part of it especially so.
      # Cached from the repository root rather than src-tauri, because the app
      # is a workspace member and shares the workspace target directory.
      - uses: Swatinem/rust-cache@v2

      # The app bundles SQLCipher and compiles OpenSSL from source to get it,
      # which is the same reason setup.sh installs Perl on Linux. OpenSSL
      # configures itself with a Perl script and assembles with NASM.
      #
      # Strawberry Perl is already on the runner image. NASM is installed here
      # rather than assumed, because a missing assembler fails deep inside a
      # build script where the reason is hard to see.
      - name: Install what OpenSSL needs
        run: choco install nasm --no-progress -y

      - name: Put NASM on the path
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      # Produces an MSI and an NSIS installer, per the bundle targets in
      # tauri.conf.json. They land in the workspace target directory at the
      # repository root, since the app is a workspace member, and not under
      # src-tauri where a standalone Tauri app would put them.
      - name: Build
        run: npm run tauri build

      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Only for a tagged release. A manual run leaves its output as an
      # artifact, which is what you want while trying things out.
      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
