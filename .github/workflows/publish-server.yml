# Builds and publishes the relay server image, so that running one is a docker
# pull rather than a git clone and a toolchain.
#
# Publishes to GitHub's own registry with no setup at all, because it
# authenticates with a token the workflow already has. Docker Hub is published to
# as well, but only once two repository secrets exist:
#
#   DOCKERHUB_USERNAME   your Docker Hub account
#   DOCKERHUB_TOKEN      an access token from Docker Hub → Account settings →
#                        Personal access tokens, with Read & Write scope
#
# Until then the Docker Hub steps skip themselves rather than failing the run.

name: Publish server image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what the image is built from. A change to the app or the README
    # doesn't need a new server image.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-server.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Deliberately not --workspace. The desktop app needs a webview and its
      # system libraries to build, none of which a runner has or the server
      # needs.
      - name: Test the server and the shared protocol
        run: cargo test --locked -p feed-protocol -p feed-server

      - name: Check for lints
        run: cargo clippy --locked -p feed-protocol -p feed-server -- -D warnings

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GitHub's container registry.
      packages: write

    # Hoisted out of `secrets` on purpose. A step's `if` cannot read the secrets
    # context — only `env` — so this is what lets the Docker Hub steps skip
    # themselves when nobody has configured Docker Hub.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      # The Rust build cross-compiles, but the final image still runs a couple of
      # trivial commands as the target architecture, which needs emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub is included only when it has been configured, so a fork or a
      # fresh clone publishes to GitHub's registry and doesn't fail on a missing
      # secret.
      - name: Decide where to publish
        id: registries
        run: |
          {
            echo 'images<<END_OF_LIST'
            echo "ghcr.io/${{ github.repository_owner }}/feed-server"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/$DOCKERHUB_USERNAME/feed-server"
            fi
            echo 'END_OF_LIST'
          } >> "$GITHUB_OUTPUT"

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=feed-server
            org.opencontainers.image.description=Relay for a peer-to-peer chat network, which carries traffic it cannot read

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          # arm64 covers the cheap virtual machines a small relay tends to live
          # on, which are increasingly not x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
