# Turns a merge into main into a release.
#
# The version in package.json decides everything. Merging to main with a version
# that has not been released yet builds all three desktop platforms and the
# server image, tags the commit, and opens a draft release with the installers
# attached. Merging with a version that has already been released does nothing,
# so ordinary merges cost nothing and only a deliberate version bump publishes.
#
# That is the whole of the ceremony: bump the version on develop, merge, and
# write the notes on the draft that appears. No tag is ever made by hand.

name: Release

on:
  push:
    branches: [main]
  # For re-running a release that failed partway through. Harmless otherwise,
  # since a version already released is skipped.
  workflow_dispatch:

jobs:
  decide:
    name: Decide whether to release
    runs-on: ubuntu-latest

    # Enough to read the tags and ask whether a release already exists.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      releasing: ${{ steps.read.outputs.releasing }}

    steps:
      # Tags included, since whether one exists is the question being asked.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both a tag and a release are checked. A draft release has no tag until
      # it is published, so looking only for the tag would rebuild everything on
      # every push to main between cutting a release and publishing it.
      - name: Read the version and check it is new
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "releasing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged. Bump the version to release a new one."
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "releasing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version already has a release, possibly an unpublished draft."
          else
            echo "releasing=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$version."
          fi

  # A called workflow cannot hold more permission than the job calling it, and a
  # job that says nothing gets the repository default. So both of these spell out
  # what the workflow they call is going to ask for, or the run is rejected
  # before any of it starts.
  desktop:
    name: Desktop
    needs: decide
    if: needs.decide.outputs.releasing == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop.yml

  server:
    name: Server image
    needs: decide
    if: needs.decide.outputs.releasing == 'true'
    permissions:
      contents: read
      # What the image push needs, and the reason the first attempt at this was
      # rejected outright.
      packages: write
    uses: ./.github/workflows/publish-server.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    # Or the Docker Hub credentials would not reach the called workflow, and it
    # would quietly publish to GitHub's registry alone.
    secrets: inherit

  publish:
    name: Publish the release
    needs: [decide, desktop, server]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Every platform's artifact, each landing in a directory named after it.
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List what was built
        run: find installers -type f | sort

      # A draft, on purpose. The binaries are attached and the tag is made, and
      # nothing is public until somebody writes the notes and presses publish.
      # Generated notes are a commit list, which is a starting point rather than
      # something worth releasing as it stands.
      - name: Open a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: Local Mesh P2P Node ${{ needs.decide.outputs.version }}
          draft: true
          generate_release_notes: true
          files: installers/**/*
          fail_on_unmatched_files: true
