# Builds the desktop app for Windows, macOS and Linux.
#
# None of it can be cross compiled. Tauri needs each platform's own webview and
# installer tooling, so every target is built on a runner of that platform. That
# is the whole reason this lives in CI rather than on somebody's machine.
#
# Free to run. Actions has unlimited minutes on public repositories, including
# the Windows and macOS runners, which on a private repository would spend
# minutes at two and ten times the usual rate.

name: Build the desktop app

# Called by the release workflow, and available on its own for trying a build
# without releasing anything. Deliberately not run on every push: a desktop
# build takes long enough that it would be mostly waste.
#
# It never touches a release. It leaves installers as artifacts and the release
# workflow decides what to do with them, so there is one place that publishes
# rather than three racing to.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      # One platform failing should not cancel the others. Finding out that
      # macOS is broken is no reason to throw away a good Windows build.
      fail-fast: false
      matrix:
        include:
          # `target` is empty wherever the runner already matches what it is
          # building for, and set only on macOS, where one download should work
          # on both Apple Silicon and Intel.
          - name: Windows
            os: windows-latest
            target: ""
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe

          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            bundles: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg

          - name: Linux
            os: ubuntu-22.04
            target: ""
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Both halves of a universal macOS binary. Rust cannot produce one without
      # having been told to build for each architecture first.
      - name: Add the macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Rust builds here are long, and the OpenSSL part of it especially so.
      # Cached from the repository root rather than src-tauri, because the app
      # is a workspace member and shares the workspace target directory.
      - uses: Swatinem/rust-cache@v2
        with:
          # Or all three platforms would fight over one cache entry.
          key: ${{ matrix.name }}

      # The same list setup.sh installs, and for the same reasons. The webview
      # and its system libraries are what a Linux desktop build cannot do
      # without, and perl is for OpenSSL rather than for us: the app bundles
      # SQLCipher and compiles OpenSSL from source to get it.
      - name: Install the Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            perl

      # OpenSSL again. Strawberry Perl is already on the Windows runner image,
      # but NASM is installed rather than assumed, because a missing assembler
      # fails deep inside a build script where the reason is hard to see.
      - name: Install what OpenSSL needs on Windows
        if: matrix.os == 'windows-latest'
        run: choco install nasm --no-progress -y

      - name: Put NASM on the path
        if: matrix.os == 'windows-latest'
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      # Bundles land in the workspace target directory at the repository root,
      # since the app is a workspace member, and not under src-tauri where a
      # standalone Tauri app would put them. A named target adds a directory of
      # its own, which is why the macOS paths above are longer.
      - name: Build
        run: npm run tauri build ${{ matrix.target && format('-- --target {0}', matrix.target) || '' }}

      - name: Collect the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.bundles }}
          if-no-files-found: error
