[package]
name = "indicium-server"
description = "Carries traffic between nodes that cannot reach each other directly"
version.workspace = true
edition.workspace = true

[dependencies]
indicium-protocol.workspace = true
libp2p.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
toml = "0.9"

# Only the probes use these. The server itself carries streams without
# understanding them, so it needs no stream behaviour of its own.
[dev-dependencies]
libp2p-stream = "0.4.0-alpha"
