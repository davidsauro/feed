# Example configuration. Every setting here is optional: a server started with
# no configuration file at all listens on port 4001 and carries traffic for
# anyone. Copy this to feed-server.toml and change what you care about.

# Addresses to listen on. The port is part of the address every client is
# configured with, so changing it later means updating every client.
listen_on = ["/ip4/0.0.0.0/tcp/4001"]

# How this server is reached from outside, without the /p2p/ part.
#
# Needed for file transfers and nothing else. When a client reserves a slot here
# so that others can reach it through this server, the reply has to say what
# address to use. A server listening on 0.0.0.0 does not know, and every
# reservation fails with NoAddressesInReservation until this is set.
#
# Left empty, a listen address naming a real interface is used. A container
# publishing a port does not qualify, so in Docker this is effectively required.
external_addresses = [
    # "/dns4/relay.example.com/tcp/4001",
]

# Where this server's identity is kept. Clients address a server by its public
# key as well as its hostname, so losing this file makes every existing client
# configuration wrong. In a container, put it on a mounted volume.
identity_file = "identity.bin"

# Who may connect, by peer id. Leave it empty, which is the default, and anyone
# may.
#
# An open server is useful and easy to run, but it is also bandwidth anyone who
# finds it can spend. The limits below are what stand between an open server and
# whoever wants to take advantage of it.
allowed_peers = [
    # "12D3KooWCfRCgiQUEL6MkbU8rBNGySLjJCi3iYSKRpAc2w7u8TPW",
]

# Other servers to connect to. People using those servers and people using this
# one can then reach each other.
#
# Each address must end with /p2p/<peer id>: that is what proves the machine
# answering is the server you meant, and not whatever else has the hostname
# today. Siblings are added to the allowlist automatically, so closing a server
# doesn't accidentally cut it off from the others.
siblings = [
    # "/dns4/relay2.example.com/tcp/4001/p2p/12D3KooW...",
]

[limits]
# Conversations one client may ask this server to carry, and how many it will
# carry in total.
#
# Connection limits do not cover this: a single connection can ask for any
# number of conversations, and each one costs memory here.
max_topics_per_peer = 64
max_topics_total = 4096

# Connections. Two per peer allows a new one to be established before an old one
# has finished closing. The pending limits matter most on an open server, since
# handshakes that never complete are the cheapest thing to flood it with.
max_connections_per_peer = 2
max_pending_incoming = 64
max_pending_outgoing = 16
max_connections_incoming = 512
max_connections_outgoing = 32
max_connections_total = 550

[relay]
# Whether to carry connections between two people who cannot reach each other
# directly, which is what makes file transfers work off the local network.
#
# On by default. Turning it off leaves conversations working and stops file
# transfers through this server.
enabled = true

# Total bytes ONE RELAYED CONNECTION may carry before it is cut off.
#
# Not a file size limit, which is the mistake this comment exists to prevent. A
# relayed connection carries everything between two people, in both directions,
# for as long as it lives: several transfers, plus the conversation traffic
# alongside them. The count never resets while the connection is up. Set this to
# 25 MB expecting it to cap a 25 MB file and the second file will be cut off
# halfway.
#
# So keep it well clear of ordinary use. It is a backstop against somebody
# streaming without end, and the app's own per-file limit is what tells a person
# a particular file is too big.
#
# When it does fire, the connection simply ends. Nothing is said about why, and
# the transfer is caught by its hash rather than by an error.
#
# 0 means no limit.
max_circuit_bytes = 268435456

# How long one relayed connection may live, in seconds.
#
# A hard timer from the moment it is established, not an idle timeout. The libp2p
# default of two minutes is far too short here, because a relayed connection
# carries the conversation as well as any transfers and is meant to last as long
# as two people are talking.
max_circuit_duration_secs = 3600

# How many clients may hold a reservation. Every client that wants to be
# reachable through this server needs one, so this wants to be in step with
# max_connections_incoming above.
max_reservations = 512
