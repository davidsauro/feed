# Workspace root.
#
# Three crates share this repository:
#
#   src-tauri        the desktop app, which is what an end user runs
#   crates/protocol  the handful of things both ends must agree on
#   crates/server    the daemon that carries traffic between nodes over the
#                    internet, built into a container image
#
# They live together rather than in separate repositories because a change to
# how nodes talk usually touches two of them at once, and coordinating that
# across repositories means every protocol tweak becomes a release. The server
# is deliberately ignorant of what it carries, so if that ever stops being true
# it will be a sign the split should happen after all.
#
# Dependency versions are declared here and inherited, so the app and the server
# cannot end up on different versions of libp2p — which would not fail to build,
# it would fail to talk.

[workspace]
resolver = "2"
members = ["src-tauri", "crates/protocol", "crates/server"]

[workspace.package]
version = "1.0.1"
edition = "2021"

[workspace.dependencies]
feed-protocol = { path = "crates/protocol" }

libp2p = { version = "0.56.0", features = [
    "cbor",
    "ed25519",
    "gossipsub",
    "macros",
    "mdns",
    "noise",
    "ping",
    "relay",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
# "fs" and "io-util" are for file transfer, which reads and writes files
# without blocking the runtime.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
futures = "0.3.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
