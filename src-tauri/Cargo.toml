[package]
name = "tauri-feed"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_feed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libp2p = { version = "0.56.0", features = ["cbor", "ed25519", "gossipsub", "macros", "mdns", "noise", "ping", "request-response", "tcp", "tokio", "yamux"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3.33"

# Group message encryption. Every one of these is already in the tree via
# libp2p-noise; the versions match so nothing is duplicated.
ed25519-dalek = "2.2.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
base64 = "0.22.1"
# SQLCipher rather than plain SQLite, so the database can optionally be
# encrypted at rest. It reads unencrypted databases exactly as before when no key
# is set, so existing data keeps working. OpenSSL is vendored to avoid adding a
# system dependency, at the cost of a longer first build.
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }

