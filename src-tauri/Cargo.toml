[package]
name = "tauri-feed"
# From the workspace, like the other two crates, so one place decides and the
# three cannot drift apart.
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Inherited from the workspace, so the app and the server cannot end up on
# different versions of the things they use to talk to each other.
feed-protocol.workspace = true
libp2p.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

# Group message encryption. Every one of these is already in the tree via
# libp2p-noise; the versions match so nothing is duplicated.
ed25519-dalek = "2.2.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
base64 = "0.22.1"
# SQLCipher rather than plain SQLite, so the database can optionally be
# encrypted at rest. It reads unencrypted databases exactly as before when no key
# is set, so existing data keeps working. OpenSSL is vendored to avoid adding a
# system dependency, at the cost of a longer first build.
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
libp2p-stream = "0.4.0-alpha"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"

